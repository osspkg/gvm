name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gvm-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release tag
        id: release-tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "push" && "${REF_TYPE}" == "tag" ]]; then
            tag="${REF_NAME}"
          else
            latest="$(git tag --list 'v0.*.0' --sort=-v:refname | head -n 1)"
            if [[ -z "${latest}" ]]; then
              tag="v0.1.0"
            elif [[ "${latest}" =~ ^v0\.([0-9]+)\.0$ ]]; then
              minor="${BASH_REMATCH[1]}"
              tag="v0.$((10#${minor} + 1)).0"
            else
              echo "::error::Latest release tag must match v0.<minor>.0: ${latest}" >&2
              exit 1
            fi

            if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
              echo "::error::Release tag already exists: ${tag}" >&2
              exit 1
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" "${GITHUB_SHA}" -m "Release ${tag}"
            git push origin "refs/tags/${tag}"
          fi

          if [[ ! "${tag}" =~ ^v0\.[0-9]+\.0$ ]]; then
            echo "::error::Release tag must match v0.<minor>.0: ${tag}" >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Build release archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          stage="$(mktemp -d)"
          trap 'rm -rf "${stage}"' EXIT
          suffix=""
          extension="tar.gz"
          if [ "${GOOS}" = "windows" ]; then
            suffix=".exe"
            extension="zip"
          fi
          go build -trimpath -ldflags "-s -w -X github.com/osspkg/gvm/internal/version.Value=${VERSION}" -o "${stage}/gvm${suffix}" ./cmd/gvm
          go build -trimpath -ldflags "-s -w -X github.com/osspkg/gvm/internal/version.Value=${VERSION}" -o "${stage}/go${suffix}" ./cmd/go
          archive="gvm_${version}_${GOOS}_${GOARCH}.${extension}"
          if [ "${GOOS}" = "windows" ]; then
            (cd "${stage}" && zip -q "${GITHUB_WORKSPACE}/${archive}" "gvm.exe" "go.exe")
          else
            tar -czf "${archive}" -C "${stage}" gvm go
          fi
          sha256sum "${archive}" > "${archive}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            gvm_*

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: cat *.sha256 | sort -k2 > checksums.txt
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release create "${RELEASE_TAG}" --draft --generate-notes --verify-tag
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "${RELEASE_TAG}" dist/* --clobber
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "${RELEASE_TAG}" --draft=false
